      llama-swap:
        image: docker.io/local/llama-swap:arm64
        container_name: llama-swap
        ports:
            - "8088:8080"
        volumes:
            - /opt/atom/llama-swap/config.yaml:/app/config.yaml:ro
            - /var/run/docker.sock:/var/run/docker.sock
            - /opt/atom/models:/models
            - /home/g/.cache/huggingface:/root/.cache/huggingface
        command:
            - "--config"
            - "/app/config.yaml"
            - "--listen"
            - "0.0.0.0:8080"
        restart: unless-stopped

    # =========================

    # LiteLLM Router

    # =========================

      litellm:
        image: ghcr.io/berriai/litellm:main-latest
        container_name: litellm
        depends_on:
            - sglang-qwen38
            - llama-swap
        ports:
            - "4000:4000"
        volumes:
            - ./litellm/config.yaml:/app/config.yaml
        command:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--host"
            - "0.0.0.0"
        restart: unless-stopped

      open-webui:
        image: ghcr.io/open-webui/open-webui:v0.11.3
        container_name: open-webui
        depends_on:
            - llama-swap
        ports:
            - "3000:8080"
        volumes:
            - open-webui-data:/app/backend/data
        environment:
            OPENAI_API_BASE_URL: http://litellm:4000/v1
            OPENAI_API_KEY: not-needed
            ENABLE_OLLAMA_API: "false"
            OPENAI_MODEL_LIST: '["radixark-qwen38-27b-nvfp4-dflash2-262k-think"]'
        restart: unless-stopped

      # LAN reverse proxy — chat.home.lan -> Open Web UI (Caddyfile in ./caddy)
      caddy:
        image: local/caddy-cloudflare
        container_name: caddy
        env_file:
            - /opt/atom/.env
        environment:
            - CF_API_TOKEN=${CF_API_TOKEN:-}
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        restart: unless-stopped

