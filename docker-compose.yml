#             # DFlash spec decode DISABLED 2026-08-11 — engine deadlocked (spun 100% CPU, 0 completions for 38h)
#             # Re-enable only after upstream AEON fixes the DFlash hang; baseline = no spec decode (~73 tok/s)
#             # - --speculative-config
#             # - '{"method":"dflash","model":"/dflash","num_speculative_tokens":12,"attention_backend":"TRITON_ATTN"}'
#         restart: unless-stopped
# 
#     # --- Qwen3.8-27B SGLang (MAIN MODEL — 2026-08-17 flip) ---
#     # Safe GB10 config per hasso5703 field validation (forum 380257): mem-fraction 0.50 +
#     # docker memory caps — SGLang's accounting misses 25-40GB of transient allocations
#     # (flashinfer autotuner, cuda-graph capture) on unified memory; >0.50 risks a hard freeze.
#     # DFlash2 drafter (z-lab) — promoted 2026-08-20 after soak PASS (200/200, +51% solo vs DSpark)
#     # DSpark k7 was the previous draft (community-validated); MTP is a one-flag alternative
#     # (--speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1
#     #  --speculative-num-draft-tokens 4) that measured ~20% faster on fresh codegen.
#     # Weights pre-seeded at /opt/atom/models/hf-cache — no first-boot download.
      sglang-qwen38:
        image: weschera/qwen38-27b-dflash2:2026-08-19
        container_name: sglang-qwen38
        cpuset: "5-9,15-19"
        runtime: nvidia
        shm_size: "32gb"
        ipc: host
        mem_limit: 100g
        memswap_limit: 100g
        ports:
            - "8888:8888"
        volumes:
            - /opt/atom/models/hf-cache:/root/.cache/huggingface
            - sglang-triton-cache:/root/.triton
        environment:
            - HF_HOME=/root/.cache/huggingface
            - TRITON_CACHE_DIR=/root/.triton
            - HF_TOKEN=${HF_TOKEN:-}
        command:
            - python3
            - -m
            - sglang.launch_server
            - --model-path
            - RadixArk/Qwen3.8-27B-NVFP4
            - --served-model-name
            - radixark-qwen38-27b-nvfp4-dflash2-262k-think
            - --trust-remote-code
            - --mem-fraction-static
            - "0.50"
            - --attention-backend
            - flashinfer
            - --chunked-prefill-size
            - "8192"
            - --disable-prefill-cuda-graph
            - --kv-cache-dtype
            - fp8_e4m3
            - --mamba-ssm-dtype
            - bfloat16
            - --mamba-full-memory-ratio
            - "4.21"
            - --mamba-radix-cache-strategy
            - extra_buffer
            - --max-mamba-cache-size
            - "16"
            - --max-running-requests
            - "4"
            - --max-prefill-tokens
            - "16384"
            - --context-length
            - "262144"
            - --speculative-algorithm
            - DFLASH
            - --speculative-draft-model-path
            - z-lab/Qwen3.8-27B-DFlash2
            - --speculative-num-draft-tokens
            - "8"
            - --enable-metrics
            - --reasoning-parser
            - qwen3
            - --tool-call-parser
            - qwen3_coder
            - --sampling-defaults
            - model
            - --host
            - "0.0.0.0"
            - --port
            - "8888"
        restart: unless-stopped

