global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'vllm'
    static_configs:
      - targets: ['172.18.0.1:8000']

  - job_name: 'llama-swap'
    static_configs:
      - targets: ['llama-swap:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

